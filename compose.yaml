services:
  postgres:
    image: postgres:18-alpine
    container_name: imobiliaria-postgres
    environment:
      POSTGRES_DB: imobiliaria
      POSTGRES_USER: imobiliaria
      POSTGRES_PASSWORD: imobiliaria
    ports:
      - "5433:5432"
    volumes:
      - imobiliaria-pgdata:/var/lib/postgresql

volumes:
  imobiliaria-pgdata:
